name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /dudahero/dudahero-server
            docker-compose down
            rm -vrf .env
            git stash
            git pull origin main
            git log | head -n 10
            echo "MONGO_DB_URL=${{ secrets.MONGO_DB_URL }}" > .env
            echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> .env
            echo "MONGO_DB_USER=${{ secrets.MONGO_DB_USER }}" >> .env
            echo "MONGO_DB_PASS=${{ secrets.MONGO_DB_PASS }}" >> .env
            echo "MONGO_DB_NAME=${{ secrets.MONGO_DB_NAME }}" >> .env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env
            echo "BACKEND_PORT=${{ secrets.BACKEND_PORT }}" >> .env
            echo "BACKEND_HOST=${{ secrets.BACKEND_HOST }}" >> .env
            docker-compose build --no-cache
            docker-compose up -d

  notify:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const ok = process.env.RESULT === 'success';
            const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: context.sha });
            const message = commit.commit.message.split('\n')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'deploy-notifications', per_page: 1,
            });
            let issue = issues[0];
            if (!issue) {
              ({ data: issue } = await github.rest.issues.create({
                ...context.repo,
                title: 'Deploy notifications',
                labels: ['deploy-notifications'],
                body: 'A comment is posted here every time `main` is deployed to the server. Subscribe to this issue to get notified.',
              }));
            }

            const body = [
              `${ok ? '✅' : '❌'} **main** ${ok ? 'deployed to the server' : `deploy ${process.env.RESULT}`}: [${context.sha.slice(0, 7)}](${commit.html_url}) ${message}`,
              '',
              `Run: ${runUrl}`,
            ].join('\n');
            await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
